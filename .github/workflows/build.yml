name: Build Eco11 Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "apps/desktop"
          tagName: v1.0.0
          releaseName: "Eco11 v1.0.0"
          releaseBody: "Automated Eco11 release build"
          releaseDraft: false
          prerelease: false

      - name: Create Release Zip Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist_release"
          Get-ChildItem -Recurse -Filter "*.exe" "apps/desktop/src-tauri/target/release" | Copy-Item -Destination "dist_release" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter "*.msi" "apps/desktop/src-tauri/target/release" | Copy-Item -Destination "dist_release" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist_release\*" -DestinationPath "Eco11_Windows_Release.zip" -Force

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eco11-Windows-Release
          path: Eco11_Windows_Release.zip
