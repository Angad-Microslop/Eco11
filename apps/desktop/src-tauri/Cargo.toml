[package]
name = "eco11-desktop"
version = "1.0.0"
description = "Eco11 Desktop App"
authors = ["Angel"]
edition = "2021"

[lib]
name = "eco11_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
